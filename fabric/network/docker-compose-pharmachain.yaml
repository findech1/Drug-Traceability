version: '3.7'

networks:
  pharmachain:
    name: pharmachain_ke_net

services:
  # ============================================================================
  # RAFT ORDERING SERVICE
  # ============================================================================
  orderer.pharmachain.ke:
    container_name: orderer.pharmachain.ke
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/pharmachain.ke/orderers/orderer.pharmachain.ke/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/pharmachain.ke/orderers/orderer.pharmachain.ke/tls:/var/hyperledger/orderer/tls
    ports:
      - 7050:7050
      - 7053:7053
    networks:
      - pharmachain

  # ============================================================================
  # APACHE COUCHDB STATE DATABASES (1 PER ORG PEER)
  # ============================================================================
  couchdb.dawa:
    container_name: couchdb.dawa
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 5984:5984
    networks:
      - pharmachain

  couchdb.kemsa:
    container_name: couchdb.kemsa
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 6984:5984
    networks:
      - pharmachain

  couchdb.goodlife:
    container_name: couchdb.goodlife
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 7984:5984
    networks:
      - pharmachain

  couchdb.ppb:
    container_name: couchdb.ppb
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 8984:5984
    networks:
      - pharmachain

  # ============================================================================
  # HYPERLEDGER FABRIC PEERS WIRED TO COUCHDB
  # ============================================================================
  peer0.dawa.pharmachain.ke:
    container_name: peer0.dawa.pharmachain.ke
    image: hyperledger/fabric-peer:2.5
    depends_on:
      - couchdb.dawa
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=pharmachain_ke_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.dawa.pharmachain.ke
      - CORE_PEER_ADDRESS=peer0.dawa.pharmachain.ke:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.dawa.pharmachain.ke:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.dawa.pharmachain.ke:7051
      - CORE_PEER_LOCALMSPID=DawaLifeMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.dawa:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/dawa.pharmachain.ke/peers/peer0.dawa.pharmachain.ke/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/dawa.pharmachain.ke/peers/peer0.dawa.pharmachain.ke/tls:/etc/hyperledger/fabric/tls
    ports:
      - 7051:7051
    networks:
      - pharmachain

  peer0.kemsa.pharmachain.ke:
    container_name: peer0.kemsa.pharmachain.ke
    image: hyperledger/fabric-peer:2.5
    depends_on:
      - couchdb.kemsa
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=pharmachain_ke_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.kemsa.pharmachain.ke
      - CORE_PEER_ADDRESS=peer0.kemsa.pharmachain.ke:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.kemsa.pharmachain.ke:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.kemsa.pharmachain.ke:9051
      - CORE_PEER_LOCALMSPID=KemsaSupplyMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.kemsa:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/kemsa.pharmachain.ke/peers/peer0.kemsa.pharmachain.ke/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/kemsa.pharmachain.ke/peers/peer0.kemsa.pharmachain.ke/tls:/etc/hyperledger/fabric/tls
    ports:
      - 9051:9051
    networks:
      - pharmachain

  peer0.goodlife.pharmachain.ke:
    container_name: peer0.goodlife.pharmachain.ke
    image: hyperledger/fabric-peer:2.5
    depends_on:
      - couchdb.goodlife
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=pharmachain_ke_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.goodlife.pharmachain.ke
      - CORE_PEER_ADDRESS=peer0.goodlife.pharmachain.ke:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.goodlife.pharmachain.ke:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.goodlife.pharmachain.ke:11051
      - CORE_PEER_LOCALMSPID=GoodlifePharmMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.goodlife:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/goodlife.pharmachain.ke/peers/peer0.goodlife.pharmachain.ke/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/goodlife.pharmachain.ke/peers/peer0.goodlife.pharmachain.ke/tls:/etc/hyperledger/fabric/tls
    ports:
      - 11051:11051
    networks:
      - pharmachain

  peer0.ppb.pharmachain.ke:
    container_name: peer0.ppb.pharmachain.ke
    image: hyperledger/fabric-peer:2.5
    depends_on:
      - couchdb.ppb
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=pharmachain_ke_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.ppb.pharmachain.ke
      - CORE_PEER_ADDRESS=peer0.ppb.pharmachain.ke:13051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:13051
      - CORE_PEER_CHAINCODEADDRESS=peer0.ppb.pharmachain.ke:13052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:13052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.ppb.pharmachain.ke:13051
      - CORE_PEER_LOCALMSPID=PpbRegulatorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.ppb:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/ppb.pharmachain.ke/peers/peer0.ppb.pharmachain.ke/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/ppb.pharmachain.ke/peers/peer0.ppb.pharmachain.ke/tls:/etc/hyperledger/fabric/tls
    ports:
      - 13051:13051
    networks:
      - pharmachain
